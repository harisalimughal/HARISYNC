<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <!-- WhatsApp background -->
  <rect width="600" height="500" rx="20" fill="#0b141a"/>
  <rect width="600" height="500" rx="20" fill="#0b141a" opacity="0.95"/>

  <!-- Chat wallpaper pattern dots -->
  <circle cx="50" cy="120" r="2" fill="#1a2c34" opacity="0.5"/>
  <circle cx="150" cy="180" r="2" fill="#1a2c34" opacity="0.5"/>
  <circle cx="450" cy="140" r="2" fill="#1a2c34" opacity="0.5"/>
  <circle cx="350" cy="300" r="2" fill="#1a2c34" opacity="0.5"/>
  <circle cx="520" cy="250" r="2" fill="#1a2c34" opacity="0.5"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="600" height="60" rx="20" fill="#1f2c34"/>
  <rect x="0" y="20" width="600" height="40" fill="#1f2c34"/>
  <text x="35" y="25" font-family="Arial" font-size="12" fill="#8696a0" text-anchor="middle">&lt;</text>
  <circle cx="65" cy="30" r="18" fill="#25d366"/>
  <text x="65" y="36" font-family="Arial" font-size="18" fill="white" text-anchor="middle">H</text>
  <text x="95" y="26" font-family="Arial" font-size="15" fill="#e9edef" font-weight="bold">HARISYNC Bot</text>
  <text x="95" y="44" font-family="Arial" font-size="11" fill="#8696a0">online</text>

  <!-- Received message 1 - Bot welcome -->
  <rect x="30" y="75" width="320" height="55" rx="8" fill="#1f2c34"/>
  <polygon points="30,75 22,75 30,90" fill="#1f2c34"/>
  <text x="42" y="93" font-family="Arial" font-size="13" fill="#e9edef">Welcome to HARISYNC! 👋</text>
  <text x="42" y="111" font-family="Arial" font-size="13" fill="#e9edef">How can we help you today?</text>
  <text x="330" y="124" font-family="Arial" font-size="9" fill="#8696a0">10:30 AM</text>

  <!-- Sent message 1 - User -->
  <rect x="300" y="145" width="265" height="40" rx="8" fill="#005c4b"/>
  <polygon points="565,145 573,145 565,160" fill="#005c4b"/>
  <text x="315" y="165" font-family="Arial" font-size="13" fill="#e9edef">Hi! I need a WhatsApp bot</text>
  <text x="535" y="178" font-family="Arial" font-size="9" fill="#8696a0">10:31</text>

  <!-- Received message 2 - Bot reply -->
  <rect x="30" y="200" width="360" height="72" rx="8" fill="#1f2c34"/>
  <text x="42" y="220" font-family="Arial" font-size="13" fill="#e9edef">Great choice! 🤖 We can build:</text>
  <text x="42" y="240" font-family="Arial" font-size="13" fill="#e9edef">• Customer support automation</text>
  <text x="42" y="257" font-family="Arial" font-size="13" fill="#e9edef">• Order tracking &amp; notifications</text>
  <text x="370" y="266" font-family="Arial" font-size="9" fill="#8696a0">10:31 AM</text>

  <!-- Sent message 2 -->
  <rect x="260" y="288" width="305" height="40" rx="8" fill="#005c4b"/>
  <polygon points="565,288 573,288 565,303" fill="#005c4b"/>
  <text x="275" y="308" font-family="Arial" font-size="13" fill="#e9edef">I want order tracking for my store</text>
  <text x="535" y="321" font-family="Arial" font-size="9" fill="#8696a0">10:32</text>

  <!-- Received message 3 - Bot -->
  <rect x="30" y="343" width="370" height="72" rx="8" fill="#1f2c34"/>
  <text x="42" y="363" font-family="Arial" font-size="13" fill="#e9edef">Perfect! Our WhatsApp bots handle</text>
  <text x="42" y="381" font-family="Arial" font-size="13" fill="#e9edef">10,000+ daily interactions. Let me</text>
  <text x="42" y="399" font-family="Arial" font-size="13" fill="#e9edef">connect you with our team 🚀</text>
  <text x="380" y="408" font-family="Arial" font-size="9" fill="#8696a0">10:32 AM</text>

  <!-- Typing indicator -->
  <rect x="30" y="428" width="80" height="30" rx="8" fill="#1f2c34"/>
  <circle cx="52" cy="443" r="4" fill="#8696a0" opacity="0.6"/>
  <circle cx="67" cy="443" r="4" fill="#8696a0" opacity="0.4"/>
  <circle cx="82" cy="443" r="4" fill="#8696a0" opacity="0.2"/>

  <!-- Input bar -->
  <rect x="15" y="465" width="520" height="28" rx="14" fill="#1f2c34"/>
  <text x="35" y="483" font-family="Arial" font-size="12" fill="#8696a0">Type a message</text>
  <circle cx="560" cy="479" r="14" fill="#25d366"/>
  <polygon points="555,474 565,479 555,484" fill="white"/>
</svg>